name: Daily Book Snippet

on:
  # We commented out the schedule because cron-job.org now handles the exact 5:15 AM timing.
  # schedule:
  #   - cron: '15 23 * * *'
  
  # This MUST stay active so cron-job.org is allowed to trigger the workflow via the API
  workflow_dispatch:

# We must give the action permission to save the progress.json file
permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run email script
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_email.py

      # This step saves the updated progress.json back to your GitHub
      - name: Commit progress tracker
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add progress.json
          git commit -m "Update snippet progress" || exit 0
          git push
